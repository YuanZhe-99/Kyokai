name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but documentation changed: a docs-only push or pull
  # request runs the checks (the docs mirror among them) but not the builds.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BEFORE" ] &&
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" HEAD | grep -qvE '^doc/|\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the history

      # The Go version comes from go.mod, so a Go release never changes the
      # build underneath a working checkout.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # The app targets Windows, macOS and Linux.
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: GOOS=linux go vet ./...
      - name: Interface catalogs
        run: go tool mygo i18n check
      - name: Documentation mirror
        run: go run ./tools/checkdocs

      - name: Rust formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all --check

      - name: Dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml

      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .

      # Informational here; the weekly upstream workflow opens an issue.
      - name: Upstream pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./tools/deps check

  # Clippy and the Rust tests on one runner per OS, beside the builds below
  # instead of before them.
  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-11-arm, target: windows/arm64 }
          - { os: macos-latest, target: darwin/arm64 }
          - { os: ubuntu-24.04, target: linux/amd64 }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      # rust-cache keys on every installed toolchain: the runner image's own
      # stable Rust would change the key from one image to the next.
      - name: Only the pinned toolchain
        shell: bash
        run: |
          keep=$(rustup show active-toolchain | cut -d' ' -f1)
          for t in $(rustup toolchain list | cut -d' ' -f1); do
            [ "$t" = "$keep" ] || rustup toolchain uninstall "$t"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Pinned protoc
        shell: bash
        run: echo "PROTOC=$(scripts/protoc.sh)" >> "$GITHUB_ENV"
      # The core links with libpipewire, whose bindings are generated as it
      # builds (libclang).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev nasm
      - name: Clang (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) { choco install llvm --no-progress -y }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: ./.github/actions/codecs
        with:
          targets: ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --workspace

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full gate on one runner per OS; build-only on the other arch.
          - { os: windows-11-arm, target: windows/arm64, full: true, package: true }
          - { os: macos-latest, target: darwin/arm64, full: true, package: true }
          # x64 is packaged too: the remote test VM installs it.
          - { os: windows-latest, target: windows/amd64, full: false, package: true }
          - { os: macos-15-intel, target: darwin/amd64, full: false, package: false }
          - { os: ubuntu-24.04, target: linux/amd64, full: true, package: true }
          - { os: ubuntu-24.04-arm, target: linux/arm64, full: false, package: true }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # CI packages are for testing: no LTO and parallel code generation
      # build the core minutes faster. Releases keep core/Cargo.toml's
      # profile (release.yml).
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # The build-only leg ships no package: a working library for the Go
      # tests needs less optimization.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.package && '3' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      # rust-cache keys on every installed toolchain: the runner image's own
      # stable Rust would change the key from one image to the next.
      - name: Only the pinned toolchain
        shell: bash
        run: |
          keep=$(rustup show active-toolchain | cut -d' ' -f1)
          for t in $(rustup toolchain list | cut -d' ' -f1); do
            [ "$t" = "$keep" ] || rustup toolchain uninstall "$t"
          done
      # Only main saves the cache; other refs restore it. Its own key: this
      # job's cache holds the release build only.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # EasyTier compiles its protocol files at build time; the pinned,
      # checksum-verified protoc replaces its unverified download.
      - name: Pinned protoc
        shell: bash
        run: echo "PROTOC=$(scripts/protoc.sh)" >> "$GITHUB_ENV"
      # ring (EasyTier's QUIC and WireGuard) needs clang on Windows ARM64.
      # The core links with libpipewire, whose bindings are generated as it
      # builds (libclang).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev nasm
      - name: Clang (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) { choco install llvm --no-progress -y }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # libvpx and libaom, linked statically into the core.
      - uses: ./.github/actions/codecs
        with:
          targets: ${{ matrix.target }}

      # Built for the runner's own target triple, where scripts/build.sh
      # looks too: the package reuses this build instead of a second one.
      - name: Core library
        shell: bash
        run: |
          rt=$(rustc -vV | sed -n 's/^host: //p')
          cargo build --release --manifest-path core/Cargo.toml --target "$rt"
          echo "CORE_RELEASE=core/target/$rt/release" >> "$GITHUB_ENV"
      # The core keeps its master key in the default keychain. A runner's
      # login keychain can block a write on an access prompt nobody answers,
      # so the macOS jobs use their own unlocked default keychain.
      - name: Test keychain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          kc="$RUNNER_TEMP/kyokai-test.keychain-db"
          kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"

      - name: Go tests with the real core (ABI smoke test)
        shell: bash
        run: |
          lib=$CORE_RELEASE/kyokai_core.dll
          [ "$RUNNER_OS" = macOS ] && lib=$CORE_RELEASE/libkyokai_core.dylib
          [ "$RUNNER_OS" = Linux ] && lib=$CORE_RELEASE/libkyokai_core.so
          path="$PWD/$lib"
          [ "$RUNNER_OS" = Windows ] && path=$(cygpath -w "$path")
          KYOKAI_CORE_LIB="$path" go test -timeout 3m ./...
          CGO_ENABLED=0 KYOKAI_CORE_LIB="$path" go test -timeout 3m ./...
      - name: MyGo vet
        if: matrix.full
        run: go tool mygo vet .
      - name: Engine smoke test
        if: matrix.full && runner.os != 'Linux'
        shell: bash
        run: scripts/smoke.sh user
      # A runner has no Secret Service: the smoke test (the same Device ID
      # after a restart) runs on a session bus of its own with gnome-keyring
      # and an unencrypted default keyring (--unlock with an empty password
      # makes no default collection, and creating one would ask a person).
      - name: Engine smoke test (Linux)
        if: matrix.full && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools
          k=~/.local/share/keyrings && mkdir -p $k && echo ci > $k/default
          printf '[keyring]\ndisplay-name=ci\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' > $k/ci.keyring
          dbus-run-session -- bash -c 'gnome-keyring-daemon --start --components=secrets >/dev/null && scripts/smoke.sh user'

      # Packages ship every Rust crate's license text (scripts/build.sh).
      - uses: taiki-e/install-action@v2
        if: matrix.package
        with:
          tool: cargo-about
      # The core built above goes in as is (CORE_PREBUILT): a second cargo
      # run rebuilt EasyTier and the core on windows-latest, and a restored
      # codec tree leaves no vcpkg for scripts/codecs.sh.
      - name: Package (unsigned)
        if: matrix.package
        shell: bash
        env:
          CORE_PREBUILT: "1"
        run: |
          t=${{ matrix.target }} dir=resources/${t/\//-}/bin lib=kyokai_core.dll
          if [ "$RUNNER_OS" = macOS ]; then dir="$dir/Kyokai Helper.app/Contents/MacOS" lib=libkyokai_core.dylib; fi
          if [ "$RUNNER_OS" = Linux ]; then lib=libkyokai_core.so; fi
          mkdir -p "$dir" && cp "$CORE_RELEASE/$lib" "$dir/"
          scripts/build.sh

      - uses: actions/upload-artifact@v7
        if: matrix.package
        with:
          name: unsigned-${{ matrix.os }}
          path: |
            build/*/*.exe
            build/*/*.dmg
            build/*/*.deb
          if-no-files-found: error
