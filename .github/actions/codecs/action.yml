name: Codec libraries
description: >
  Builds libvpx and libaom for the core (scripts/codecs.sh) with vcpkg at the
  commit core/vcpkg-configuration.json pins, keeping vcpkg's binary cache
  between runs (doc/en-us/ci-cd.md).
inputs:
  targets:
    description: goos/goarch targets, space-separated; empty for the runner's own
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The install trees themselves: a hit skips vcpkg altogether, whose own
    # binary cache misses whenever a runner image changes a tool its ABI hash
    # covers. Only main saves them; a release tag restores main's.
    - id: trees
      uses: actions/cache/restore@v5
      with:
        path: core/vcpkg_installed
        key: codecs-${{ runner.os }}-${{ runner.arch }}-${{ inputs.targets }}-${{ hashFiles('core/vcpkg.json', 'core/vcpkg-configuration.json', 'core/vcpkg-triplets/*') }}
    - name: vcpkg at the pinned commit
      if: steps.trees.outputs.cache-hit != 'true'
      shell: bash
      run: |
        commit=$(sed -n 's/.*"baseline": "\([0-9a-f]*\)".*/\1/p' core/vcpkg-configuration.json)
        root="$RUNNER_TEMP/vcpkg"
        git init -q "$root"
        git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg "$commit"
        git -C "$root" checkout -q FETCH_HEAD
        if [ "$RUNNER_OS" = Windows ]; then
          cmd //c "$(cygpath -w "$root/bootstrap-vcpkg.bat")" -disableMetrics
        else
          "$root/bootstrap-vcpkg.sh" -disableMetrics
        fi
        mkdir -p "$RUNNER_TEMP/vcpkg-cache"
        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
    # The x64 macOS slice assembles with NASM; Windows x64 gets it from vcpkg.
    - name: NASM (macOS)
      if: runner.os == 'macOS' && steps.trees.outputs.cache-hit != 'true'
      shell: bash
      run: brew install nasm
    # vcpkg keys its binaries by an ABI hash that includes the compiler, so a
    # runner image with a newer compiler misses them although the key below
    # matches (regression: Windows rebuilt both libraries, 8-10 minutes, on
    # every run). Each run restores the newest cache of these files (a
    # release tag restores main's: the key leaves the targets out, and vcpkg
    # keeps each triplet apart) and saves a new one only when it built
    # something.
    - uses: actions/cache/restore@v5
      if: steps.trees.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/vcpkg.json', 'core/vcpkg-configuration.json', 'core/vcpkg-triplets/*') }}-${{ github.run_id }}
        restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/vcpkg.json', 'core/vcpkg-configuration.json', 'core/vcpkg-triplets/*') }}-
    - name: Build libvpx and libaom
      if: steps.trees.outputs.cache-hit != 'true'
      shell: bash
      run: |
        dir=$VCPKG_DEFAULT_BINARY_CACHE
        [ "$RUNNER_OS" = Windows ] && dir=$(cygpath -u "$dir")
        before=$(find "$dir" -type f | wc -l)
        scripts/codecs.sh ${{ inputs.targets }}
        after=$(find "$dir" -type f | wc -l)
        echo "vcpkg binary cache: $before files before, $after after"
        echo "VCPKG_CACHE_NEW=$([ "$after" -gt "$before" ] && echo true || echo false)" >> "$GITHUB_ENV"
    - uses: actions/cache/save@v5
      if: env.VCPKG_CACHE_NEW == 'true'
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/vcpkg.json', 'core/vcpkg-configuration.json', 'core/vcpkg-triplets/*') }}-${{ github.run_id }}
    - uses: actions/cache/save@v5
      if: steps.trees.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      with:
        path: core/vcpkg_installed
        key: ${{ steps.trees.outputs.cache-primary-key }}
