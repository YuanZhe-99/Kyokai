# cargo deny --manifest-path core/Cargo.toml check
# Licenses, advisories and sources of the Rust core's dependency graph.

[graph]
targets = [
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "x86_64-linux-android",
]

[advisories]
version = 2
# Each comes in through EasyTier, whose pins exclude the fixed releases;
# revisited on every EasyTier update (doc/en-us/ci-cd.md).
ignore = [
  # hickory-proto / hickory-resolver 0.25: DNSSEC validation flaws. Only
  # DNSSEC validation, which Kyokai does not enable (the resolver answers
  # STUN server lookups).
  { id = "RUSTSEC-2026-0118", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0504", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0505", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0511", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0512", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0514", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0530", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0531", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0532", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0549", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0550", reason = "DNSSEC validation is not enabled" },
  { id = "RUSTSEC-2026-0551", reason = "DNSSEC validation is not enabled" },
  # hickory-proto 0.25: O(n^2) name compression when encoding. Kyokai only
  # encodes its own small STUN lookups.
  { id = "RUSTSEC-2026-0119", reason = "only small, self-made queries are encoded" },
  # hickory-proto 0.25: panics when parsing zone files or record text. Kyokai
  # never parses zone files (the resolver decodes DNS wire messages only).
  { id = "RUSTSEC-2026-0487", reason = "zone files are never parsed" },
  { id = "RUSTSEC-2026-0489", reason = "zone files are never parsed" },
  { id = "RUSTSEC-2026-0490", reason = "zone files are never parsed" },
  # hickory-proto 0.25 (pinned by EasyTier): initial vector capacity from the
  # DNS message header's record counts. Only the system DNS resolver is
  # queried for STUN lookups.
  { id = "RUSTSEC-2026-0491", reason = "pinned by EasyTier at 0.25; only the system resolver is queried for STUN" },
  # zip 8: extraction flaws. A build dependency of easytier-proto for its
  # protoc download, which never runs: the build sets PROTOC.
  { id = "RUSTSEC-2026-0367", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0368", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0369", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0429", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0545", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0546", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0547", reason = "build-time only; PROTOC is set" },
  { id = "RUSTSEC-2026-0548", reason = "build-time only; PROTOC is set" },
  # zstd 0.13 / zstd-safe 7 (zip 8's zstd feature): streaming decompression
  # flaws. Reached only through the same unused zip build dependency.
  { id = "RUSTSEC-2026-0391", reason = "build-time only, through zip; PROTOC is set" },
  { id = "RUSTSEC-2026-0398", reason = "build-time only, through zip; PROTOC is set" },
  { id = "RUSTSEC-2026-0403", reason = "build-time only, through zip; PROTOC is set" },
  # crypto-bigint 0.5 (through opaque-ke 4.0's elliptic-curve 0.13): timing
  # variability in constant-time operations. Kyokai's OPAQUE suite is
  # Ristretto255 (curve25519-dalek): elliptic-curve's arithmetic never runs.
  # Revisited with the next stable opaque-ke (4.1 moves to elliptic-curve 0.14).
  { id = "RUSTSEC-2026-0387", reason = "OPAQUE uses Ristretto255, not elliptic-curve's arithmetic" },
  # Unmaintained, no known vulnerability.
  { id = "RUSTSEC-2021-0153", reason = "encoding: unmaintained, used by EasyTier" },
  { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, used by EasyTier's reed-solomon-erasure" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc macro" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: folded into zbus 6; secret-service 5.2 is on zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: folded into zbus 6; secret-service 5.2 is on zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: folded into zbus 6; secret-service 5.2 is on zbus 5" },
  { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained advisory, used by EasyTier and core timestamps" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Kyokai is AGPL-3.0-only, so these combine with it. EasyTier is LGPL-3.0;
# vendored RustDesk code is AGPL-3.0. Anything else needs a review first.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "AGPL-3.0-only",
  # Permissive licenses in EasyTier's graph: smoltcp and managed (0BSD),
  # libbz2-rs-sys (bzip2), webpki-roots (CDLA-Permissive-2.0).
  "0BSD",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  # arboard's Windows clipboard crates (clipboard-win, error-code).
  "BSL-1.0",
]

# EasyTier's crates carry no license field; the repository is LGPL-3.0.
[[licenses.clarify]]
crate = "easytier"
expression = "LGPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "easytier-core"
expression = "LGPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "easytier-proto"
expression = "LGPL-3.0-only"
license-files = []

[licenses.private]
# The workspace's own crates (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path crates (vendored code, the thunk-rs stand-in).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# EasyTier is a git dependency pinned by commit (third_party/upstream.json).
allow-git = [
  "https://github.com/EasyTier/EasyTier",
  # EasyTier's forks, pinned through Cargo.lock.
  "https://github.com/EasyTier/service-manager-rs.git",
  "https://github.com/EasyTier/tokio-websockets",
  "https://github.com/EasyTier/windivert-rust.git",
]
