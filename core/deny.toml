# cargo deny --manifest-path core/Cargo.toml check
# Licenses, advisories and sources of the Rust core's dependency graph.

[graph]
targets = [
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Kyokai is AGPL-3.0-only, so these combine with it. EasyTier is LGPL-3.0;
# vendored RustDesk code is AGPL-3.0. Anything else needs a review first.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "AGPL-3.0-only",
]

[licenses.private]
# The workspace's own crates (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# EasyTier is a git dependency pinned by commit (third_party/upstream.json).
allow-git = ["https://github.com/EasyTier/EasyTier"]
