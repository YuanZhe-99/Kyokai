[package]
name = "kyokai-core"
# The product version comes from the binary that starts the core
# (internal/version), so this one never changes.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kyokai_core"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
# The core's log lines and panics with the local time, on stderr (lib.rs,
# diagnostics); both crates are in the tree already.
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# EasyTier, pinned by commit (third_party/upstream.json), minimal feature set:
# data plane, AES-GCM, DHCP, the standard server connectors and a DNS
# resolver for STUN (doc/en-us/networking.md). No TUN, SOCKS5, KCP, faketcp,
# magic DNS, CLI or web.
easytier = { version = "2.7.0", git = "https://github.com/EasyTier/EasyTier", rev = "8b7f1f0196edb5b580829ed5f135050fb5853478", default-features = false, features = ["smoltcp", "aes-gcm", "dhcp-ipv4", "dns-resolver", "websocket", "quic", "wireguard"] }
easytier-core = { version = "2.7.0", git = "https://github.com/EasyTier/EasyTier", rev = "8b7f1f0196edb5b580829ed5f135050fb5853478", default-features = false }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
# OPAQUE (opaque-ke) builds on the RustCrypto 0.10 generation: its RNG trait
# and SHA-512 come from rand_core 0.6 and sha2 0.10.
rand_core = { version = "0.6", features = ["getrandom"] }
rustdesk-qos = { path = "../third_party/rustdesk-qos" }
rustdesk-codec = { path = "../third_party/rustdesk-codec" }
sha2_10 = { package = "sha2", version = "0.10" }
snow = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "io-util", "sync", "macros", "net"] }
# Listeners for connections by address: IPv6 beside IPv4 (only_v6).
socket2 = "0.6.5"
uuid = { version = "1.26", features = ["v5"] }
zeroize = "1.9.1"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# SSH user-auth signatures with RSA and ECDSA sign-in keys (keys.rs); in the
# tree already through rustls.
ring = "0.17.14"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

[target."cfg(windows)".dependencies]
rustdesk-dxgi = { path = "../third_party/rustdesk-dxgi" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Devices", "Win32_Devices_FunctionDiscovery", "Win32_Media", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
# ScreenCaptureKit capture, Core Graphics displays and input, and the
# privacy checks (doc/en-us/computer-use.md).
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
# VideoToolbox: H.264 and HEVC in hardware (doc/en-us/computer-use.md).
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2", "bitflags", "objc2-core-media", "objc2-core-video", "VTBase", "VTCompressionProperties", "VTCompressionSession", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "VTSession", "VTVideoEncoderList"] }
objc2-application-services = "0.3.2"
# The helper's socket to its session agent: the peer's process and user.
libc = "0.2.190"
