[package]
name = "kyokai-core"
# The product version comes from the binary that starts the core
# (internal/version), so this one never changes.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kyokai_core"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
# EasyTier, pinned by commit (third_party/upstream.json), minimal feature set:
# data plane, AES-GCM, DHCP, the standard server connectors and a DNS
# resolver for STUN (doc/en-us/networking.md). No TUN, SOCKS5, KCP, faketcp,
# magic DNS, CLI or web.
easytier = { version = "2.7.0", git = "https://github.com/EasyTier/EasyTier", rev = "8b7f1f0196edb5b580829ed5f135050fb5853478", default-features = false, features = ["smoltcp", "aes-gcm", "dhcp-ipv4", "dns-resolver", "websocket", "quic", "wireguard"] }
easytier-core = { version = "2.7.0", git = "https://github.com/EasyTier/EasyTier", rev = "8b7f1f0196edb5b580829ed5f135050fb5853478", default-features = false }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
# OPAQUE (opaque-ke) builds on the RustCrypto 0.10 generation: its RNG trait
# and SHA-512 come from rand_core 0.6 and sha2 0.10.
rand_core = { version = "0.6", features = ["getrandom"] }
rustdesk-qos = { path = "../third_party/rustdesk-qos" }
rustdesk-codec = { path = "../third_party/rustdesk-codec" }
sha2_10 = { package = "sha2", version = "0.10" }
snow = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "io-util", "sync", "macros"] }
uuid = { version = "1.26", features = ["v5"] }
zeroize = "1.9.1"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

[target."cfg(windows)".dependencies]
rustdesk-dxgi = { path = "../third_party/rustdesk-dxgi" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
