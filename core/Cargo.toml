[workspace]
members = ["kyokai-core", "third_party/rustdesk-codec", "third_party/rustdesk-dxgi", "third_party/rustdesk-qos"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# EasyTier's build script calls thunk-rs on x86/x64 Windows to target
# Windows 7; Kyokai replaces it with a no-op (core/third_party/thunk-noop).
[patch."https://github.com/EasyTier/thunk.git"]
thunk-rs = { path = "third_party/thunk-noop" }
