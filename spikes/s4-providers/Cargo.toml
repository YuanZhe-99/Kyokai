# S4 spike: OpenAI + Claude computer-use round trips. Its own workspace, outside the product build.
# TLS: the OS stack (native-tls) so the spike builds without clang on PATH (ring needs it on Windows ARM64).
[workspace]

[package]
name = "s4-providers"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
png = "0.17"
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
